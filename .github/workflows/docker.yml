# shorty 的 CI/CD（第 24 章）
#
#   pull request → test → build（amd64 + arm64）→ Trivy 掃描，不 push
#   push main    → 同上 + push ghcr.io/<owner>/shorty:main、:sha-xxxxxxx
#   push v1.2.3  → 同上 + push :1.2.3、:1.2、:1、:latest、:sha-xxxxxxx
#
# 每一步的說明見 tutorials/24-github-actions/README.md

name: docker

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 預設最小權限，需要寫 GHCR 的 job 再自己加
permissions:
  contents: read

# 同一個分支／PR 有新 commit 時，取消還在跑的舊 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod        # 跟 go.mod 的 go 版本一致
          cache-dependency-path: app/go.sum  # go.mod 不在 repo 根目錄，要指定

      - run: go vet ./...
      - run: go test ./...

  docker:
    name: build / scan / push
    needs: test                              # 測試沒過就不 build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                        # 讓 GITHUB_TOKEN 能 push 到 GHCR
    steps:
      - uses: actions/checkout@v7

      # GHCR 的 image 名稱必須全小寫；repository_owner 可能有大寫（例如 ChecheHuang）
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shorty" >> "$GITHUB_ENV"

      # 註冊 QEMU。app/Dockerfile 是交叉編譯、目前用不到，
      # 但哪天 Dockerfile 在目標平台跑了 RUN，沒有它 arm64 就會 exec format error
      - uses: docker/setup-qemu-action@v4

      # 建立 docker-container builder：多平台 build 與 type=gha cache 都需要它
      - uses: docker/setup-buildx-action@v4

      # PR（特別是 fork 來的）拿不到寫入權限，也不該 push，所以只在非 PR 時登入
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 依照觸發事件產生 tag 與 OCI label
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      # 先 build 一份 amd64 載入 runner 的 Docker，給 Trivy 掃
      # （多平台 image 沒辦法 --load 進 classic image store，見第 23 章）
      - name: Build for scan (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/amd64
          load: true
          tags: shorty:scan
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      # 有「已有修正版」的 HIGH / CRITICAL 漏洞就讓 job 失敗，後面的 push 不會執行
      # 第三方 action pin 到 commit SHA（2026 年 3 月 trivy-action 曾發生 tag 被竄改事件）
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shorty:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          version: v0.76.1

      # 真正的多平台 build；PR 只 build 不 push
      # 上一步已經 build 過 amd64，這裡會直接吃 builder 裡的快取
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
